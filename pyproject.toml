[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brokoli"
version = "0.8.0"
description = "Brokoli Python SDK — define data pipelines in Python, run them visually"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6.0"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://brokoli.orkestri.site"
Documentation = "https://docs-brokoli.orkestri.site"
Repository = "https://github.com/Tnsor-Labs/brokoli-sdk"
Issues = "https://github.com/Tnsor-Labs/brokoli-sdk/issues"

[project.scripts]
brokoli = "brokoli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0", "ruff>=0.6", "mypy>=1.8", "build>=1.0"]
watch = ["sodp-client>=0.2.2"]
pandas = ["pandas>=1.5"]
pyarrow = ["pyarrow>=12.0"]

[tool.setuptools.packages.find]
include = ["brokoli*"]

# Ship the PEP 561 typing marker so `import brokoli` is type-checked by
# consumers (brokoli-sdk#15 M5). Without this the wheel omits py.typed
# and downstream type checkers treat the package as untyped.
[tool.setuptools.package-data]
brokoli = ["py.typed"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Conservative starting set: pyflakes (F) + a subset of pycodestyle (E)
# that won't fight the existing style. Expand as the codebase is cleaned.
select = ["F", "E9"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
# Lenient to start: the SDK ships py.typed for consumers now; tightening
# its own internal type-checking is incremental (see the advisory CI job).
check_untyped_defs = false
warn_unused_ignores = false
