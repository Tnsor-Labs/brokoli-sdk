name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  # Gate: the SDK must pass its suite on every supported Python.
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with dev + watch extras)
        run: python -m pip install -e ".[dev,watch]"
      - name: Test
        run: python -m pytest -q

  # Gate: the package must build, install from the wheel, expose the CLI,
  # and — the reason this job exists — actually ship py.typed.
  build:
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: py.typed is in the wheel
        run: |
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          python -m zipfile -l "$wheel" | grep -q "brokoli/py.typed" \
            || { echo "::error::py.typed missing from wheel — consumers won't get types"; exit 1; }
      - name: Install the built wheel in a clean env and smoke the CLI
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/brokoli --help >/dev/null
          # The test harness is a shipped public submodule — it must import
          # from the installed wheel, not just from the source tree.
          /tmp/wheeltest/bin/python -c "import brokoli.testing; print('brokoli.testing OK')"

  # Gate: every shipped example must compile-check against the current
  # SDK. Two real-world examples had silently rotted (they passed a kwarg
  # the SDK later began refusing at construction); this job makes "the
  # examples run" a machine-checked promise instead of a hope.
  examples:
    name: Examples compile-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: compile --check every example
        run: |
          fail=0
          for f in examples/*.py; do
            if python -m brokoli.cli compile "$f" --check >/dev/null 2>&1; then
              echo "OK  $f"
            else
              echo "::error file=$f::example fails compile --check"
              python -m brokoli.cli compile "$f" --check || true
              fail=1
            fi
          done
          exit $fail

  # Gate: exercise the SDK against the pinned real backend, not a Python
  # approximation. The backend is built from the core repository at the
  # commit below so compatibility changes are intentional and reviewable.
  backend-contract:
    name: Backend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tnsor-Labs/brokoli
          ref: v0.10.80
          path: brokoli-core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pinned backend
        working-directory: brokoli-core
        run: go build -o "$RUNNER_TEMP/brokoli" .
      - run: python -m pip install -e ".[dev]"
      - name: Run contract tests against pinned backend
        env:
          BROKOLI_BACKEND_COMMAND: ${{ runner.temp }}/brokoli serve --port 8080 --db ${{ runner.temp }}/brokoli-contract.db --api-key sdk-contract-test-key
          BROKOLI_BACKEND_URL: http://127.0.0.1:8080
          BROKOLI_TOKEN: sdk-contract-test-key
        run: python -m pytest -q tests/integration

  # Gate: formatting, lint, and type checking are part of the SDK quality
  # contract. Keep this job on the same clean source and installed
  # dependencies as the test job so local and CI results agree.
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,watch]"
      - name: ruff (lint)
        run: python -m ruff check brokoli
      - name: ruff (format)
        run: python -m ruff format --check brokoli
      - name: mypy
        run: python -m mypy brokoli
